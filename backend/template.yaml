AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Stock Insights Backend - Minimal Search Logging

Parameters:
  AllowedOrigin:
    Type: String
    Default: http://localhost:5173
    Description: Allowed CORS origin for API responses.

Globals:
  Function:
    Runtime: nodejs18.x
    Handler: src/handler.handler
    MemorySize: 512
    Timeout: 30
  Api:
    Cors:
      AllowMethods: "'GET,POST,OPTIONS'"
      AllowHeaders: "'Content-Type,Authorization,X-User-Id'"
      AllowOrigin: !Sub "'${AllowedOrigin}'"
      AllowCredentials: "'true'"

Resources:
  StockInsightsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: StockInsightsFunction
      CodeUri: .
      Runtime: nodejs18.x
      Handler: src/handler.handler
      Description: Logs stock searches to CloudWatch.
      Events:
        SearchLog:
          Type: Api
          Properties:
            Path: /stocks/search
            Method: post
        OptionsProxy:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: options
      Environment:
        Variables:
          ALLOWED_ORIGIN: !Ref AllowedOrigin

Outputs:
  ApiUrl:
    Description: Invoke URL for the deployed API
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod'
  LogGroup:
    Description: CloudWatch Log Group for search logs
    Value: !Sub '/aws/lambda/${StockInsightsFunction}'
