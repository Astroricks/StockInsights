AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Stock Insights Backend - Minimal Search Logging

Parameters:
  AllowedOrigin:
    Type: String
    Default: http://localhost:5173
    Description: Allowed CORS origin for API responses.

Globals:
  Function:
    Runtime: nodejs18.x
    Handler: src/handler.handler
    MemorySize: 512
    Timeout: 30

Resources:
  StockInsightsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: StockInsightsFunction
      CodeUri: .
      Runtime: nodejs18.x
      Handler: src/handler.handler
      Description: Logs stock searches to CloudWatch.
      Events:
        SearchLog:
          Type: Api
          Properties:
            Path: /stocks/search
            Method: post
        SearchOptions:
          Type: Api
          Properties:
            Path: /stocks/search
            Method: options
        OptionsProxy:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: options
      Environment:
        Variables:
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          AUTH0_DOMAIN: dev-qq0v6g1jo31z8gcr.us.auth0.com
          AUTH0_CLIENT_ID: TT9guu2A2W8zgIZZKAgFZc0TB9JHekst

Outputs:
  ApiUrl:
    Description: Invoke URL for the deployed API
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod'
  LogGroup:
    Description: CloudWatch Log Group for search logs
    Value: !Sub '/aws/lambda/${StockInsightsFunction}'
